[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core>=0.14.24",
    "llama-index-readers-file>=0.7.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
